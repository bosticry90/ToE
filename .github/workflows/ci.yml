name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Make checkout portable across the repository's existing long historical paths.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

jobs:
  governance:
    name: Governance
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create venv
        run: python -m venv .venv

      - name: Install CI dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==26.0
          .\.venv\Scripts\python.exe -m pip install -r requirements.ci.lock

      - name: Run dev stack preflight
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m formal.python.tools.dev_stack_preflight --report-format json

      - name: Run tooling validate checks (no writes)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tooling_validate.ps1

      - name: Run governance suite
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./governance_suite.ps1

      - name: Enforce measured policy guard (manual integration must fail by default)
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -Command
          "pwsh -NoProfile -ExecutionPolicy Bypass -File ./dual_track_execution.ps1 -Stage integration -GovernanceSuiteSeconds 1 -BranchHealthFullPytestSeconds 1 -CheckpointLadderSeconds 1; if ($LASTEXITCODE -eq 0) { throw 'Expected integration stage to fail without measured capture or explicit override.' }"

      - name: Run dual-track measured policy regression gates
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests/test_dual_track_cutover_measured_mode_policy_gate.py -q

      - name: Run ledger contradiction guard gate
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests/test_physics_progress_ledger_tgc93_consistency_gate.py -q

      - name: Run invalidation telemetry gate
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests/test_governance_invalidation_select_telemetry_gate.py -q

      - name: Positive-path measured artifact policy smoke
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -Command
          "pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m formal.python.tools.governance_runtime_baseline_capture --governance-suite-seconds 1 --branch-health-full-pytest-seconds 1 --checkpoint-ladder-seconds 1 --measurement-mode MEASURED; if ($LASTEXITCODE -ne 0) { throw 'Measured baseline artifact generation failed.' }; pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m formal.python.tools.dual_track_runtime_snapshot --governance-suite-seconds 1 --branch-health-full-pytest-seconds 1 --checkpoint-ladder-seconds 1 --measurement-mode MEASURED; if ($LASTEXITCODE -ne 0) { throw 'Measured snapshot artifact generation failed.' }; pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m formal.python.tools.dual_track_cutover_report_generate --governance-required-improvement-percent 0 --checkpoint-required-improvement-percent 0; if ($LASTEXITCODE -ne 0) { throw 'Measured cutover report generation failed.' };"

      - name: Assert measured policy satisfaction in cutover artifact
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -c
          "import json; p='formal/output/reports/dual_track_cutover_report_v0.json'; d=json.load(open(p, encoding='utf-8')); mp=d.get('measurement_policy',{}); assert mp.get('measured_mode_required') is True, 'measured_mode_required must be true'; assert mp.get('measured_mode_satisfied') is True, 'measured_mode_satisfied must be true in positive-path smoke';"

      - name: Capture governance parallel capability probe report
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m formal.python.tools.governance_parallel_capability_probe

      - name: Generate dual-track hardening closeout report
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m formal.python.tools.dual_track_hardening_closeout --min-invalidation-runs 1 --min-subset-hit-rate-percent 0

      - name: Validate dual-track hardening closeout gate
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests/test_dual_track_hardening_closeout_gate.py -q

  dependency-security:
    name: Dependency Security
    runs-on: windows-latest
    needs: governance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create venv
        run: python -m venv .venv

      - name: Install CI and security dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==26.0
          .\.venv\Scripts\python.exe -m pip install -r requirements.ci.lock pip-audit==2.10.1

      - name: Run dependency security scan
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./dependency_security_scan.ps1

      - name: Validate dependency scan report contract
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -c
          "import json; p='formal/output/reports/dependency_security_scan_report_v0.json'; d=json.load(open(p, encoding='utf-8')); assert isinstance(d.get('dependencies'), list), 'dependencies field missing or invalid'"

      - name: Run dependency security gates
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests/test_active_dependency_baseline_lock_gate.py formal/python/tests/test_dependency_security_scan_schedule_gate.py -q

  tests:
    name: Python Tests
    runs-on: windows-latest
    needs: [governance, dependency-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create venv
        run: python -m venv .venv

      - name: Install CI dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==26.0
          .\.venv\Scripts\python.exe -m pip install -r requirements.ci.lock

      - name: Run test suite
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests -q

  python-governance-linux-parity:
    name: Python Governance Linux Parity
    runs-on: ubuntu-latest
    needs: [governance, dependency-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create venv
        run: python -m venv .venv

      - name: Install CI dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip==26.0
          ./.venv/bin/python -m pip install -r requirements.ci.lock

      - name: Resolve Linux parity critical gate set
        run: ./.venv/bin/python -m formal.python.tools.governance_manifest_select --manifest formal/docs/release/GOVERNANCE_TEST_MANIFEST_v1.json --group critical_gates --enforce-expected > critical_gates_linux.txt

      - name: Resolve Linux parity integrity gate set
        run: ./.venv/bin/python -m formal.python.tools.governance_manifest_select --manifest formal/docs/release/GOVERNANCE_TEST_MANIFEST_v1.json --group integrity_gates --enforce-expected > integrity_gates_linux.txt

      - name: Run Linux parity critical gate set
        run: xargs -a critical_gates_linux.txt ./.venv/bin/python -m pytest -q

      - name: Run Linux parity integrity gate set
        run: xargs -a integrity_gates_linux.txt ./.venv/bin/python -m pytest -q

  lean-build:
    name: Lean Build
    runs-on: ubuntu-latest
    needs: [governance, dependency-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lean toolchain (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean project
        run: >
          python3 -m formal.python.tools.lean_bounded_lake
          --jobs 1 --target ToeFormal --target ToeFormalAll

  orchestration-smoke:
    name: Async Orchestration Smoke
    runs-on: windows-latest
    needs: [governance, dependency-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create venv
        run: python -m venv .venv

      - name: Install CI dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==26.0
          .\.venv\Scripts\python.exe -m pip install -r requirements.ci.lock

      - name: Run orchestration unit test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests/test_orchestration_runner.py -q

      - name: Run async orchestration manifest
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m formal.python.orchestration.runner --manifest formal/docs/release/TOE_ASYNC_ORCHESTRATION_MANIFEST_v0.json --output formal/output/reports/toe_orchestration_report_v0.json --max-concurrency 2 --fail-on-check-failure

      - name: Validate report contract fields
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -c
          "import json; p='formal/output/reports/toe_orchestration_report_v0.json'; d=json.load(open(p, encoding='utf-8')); req=['schema_id','checks_run','failures','uncertainties','speculative_flags','manual_review_required']; missing=[k for k in req if k not in d]; assert not missing, f'Missing report keys: {missing}'"

  sql-integrity-smoke:
    name: SQL Integrity Snapshot Smoke
    runs-on: windows-latest
    needs: [governance, dependency-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create venv
        run: python -m venv .venv

      - name: Install CI dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==26.0
          .\.venv\Scripts\python.exe -m pip install -r requirements.ci.lock

      - name: Run SQL snapshot tool test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests/test_sql_integrity_snapshot_tool.py -q

      - name: Build SQL integrity snapshot mirror
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m formal.python.tools.sql_integrity_snapshot --db formal/output/reports/toe_integrity_snapshot_v0.sqlite3 --report formal/output/reports/toe_integrity_snapshot_report_v0.json --fail-on-issues

  rust-trust-core:
    name: Rust Trust Core
    runs-on: windows-latest
    needs: [governance, dependency-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build trust-core pilot
        run: cargo build --manifest-path formal/rust/toe_trust_core/Cargo.toml

      - name: Run trust-core pilot
        run: cargo run --manifest-path formal/rust/toe_trust_core/Cargo.toml

  authority-forward-scaffold-smoke:
    name: Authority Forward Scaffold Smoke
    runs-on: windows-latest
    needs: [governance, dependency-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create venv
        run: python -m venv .venv

      - name: Install CI dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==26.0
          .\.venv\Scripts\python.exe -m pip install -r requirements.ci.lock

      - name: Run authority forward scaffold gates
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./py.ps1 -m pytest formal/python/tests/test_formal_python_bridge_parity_gate.py formal/python/tests/test_qm_stat_class_b_seam_physics_pilot_cycle12_gate.py formal/python/tests/test_proof_debt_witness_traceability_gate.py -q
