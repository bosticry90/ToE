name: Recovery Control Plane

on:
  push:
    branches:
      - codex/clean-integration-candidate-v0
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # The accepted repository contains historical paths beyond Win32's legacy
  # checkout limit.  This is a checkout transport setting, not a test waiver.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

jobs:
  linux-portability-diagnostics:
    name: Linux Portability Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frozen Python dependencies
        run: |
          python -m pip install --upgrade pip==26.0
          python -m pip install -r requirements.ci.lock

      - name: Capture cross-platform reconstruction evidence
        run: |
          mkdir -p formal/output/reports
          python - <<'PY'
          import json
          from pathlib import Path
          from formal.python.tools import (
              pillar_seam_unit_mapping_ledger_blocker_response_route_selection_v2 as v2,
              scalar_curved_background_retest_reports as conformal,
              scalar_stress_energy_minkowski_reports as minkowski,
          )

          root = Path("formal/output/reports")
          def differences(left, right, path="$", rows=None):
              rows = [] if rows is None else rows
              if type(left) is not type(right):
                  rows.append(
                      {"path": path, "left": repr(left), "right": repr(right)}
                  )
              elif isinstance(left, dict):
                  for key in sorted(set(left) | set(right)):
                      if key not in left or key not in right:
                          rows.append(
                              {
                                  "path": f"{path}.{key}",
                                  "left": repr(left.get(key, "<MISSING>")),
                                  "right": repr(right.get(key, "<MISSING>")),
                              }
                          )
                      else:
                          differences(left[key], right[key], f"{path}.{key}", rows)
              elif isinstance(left, list):
                  if len(left) != len(right):
                      rows.append(
                          {
                              "path": f"{path}.length",
                              "left": repr(len(left)),
                              "right": repr(len(right)),
                          }
                      )
                  for index, (left_item, right_item) in enumerate(zip(left, right)):
                      differences(
                          left_item,
                          right_item,
                          f"{path}[{index}]",
                          rows,
                      )
              elif left != right:
                  rows.append(
                      {"path": path, "left": repr(left), "right": repr(right)}
                  )
              return rows

          packet, manifest, report = v2.build_artifacts()
          (root / "linux_v2_reconstructed_packet.json").write_bytes(
              v2.canonical_json_bytes(packet)
          )
          (root / "linux_v2_reconstructed_manifest.json").write_bytes(
              v2.canonical_json_bytes(manifest)
          )
          (root / "linux_v2_reconstructed_report.json").write_bytes(
              v2.canonical_json_bytes(report)
          )
          conformal_fresh = conformal.rebuild_calculation_result()
          minkowski_fresh = minkowski.rebuild_calculation_result()
          (root / "linux_scalar_conformal_reconstructed_result.json").write_bytes(
              conformal.calculation_canonical_json_bytes(conformal_fresh)
          )
          (root / "linux_scalar_minkowski_reconstructed_result.json").write_bytes(
              minkowski.calculation_canonical_json_bytes(minkowski_fresh)
          )
          conformal_recorded = json.loads(
              conformal.CALCULATION_OUTPUT_PATH.read_text(encoding="utf-8")
          )
          minkowski_recorded = json.loads(
              minkowski.CALCULATION_OUTPUT_PATH.read_text(encoding="utf-8")
          )
          diagnostics = {
              "conformal": {
                  "verification": conformal.verify_calculation_result(),
                  "differences": differences(
                      conformal_recorded,
                      conformal_fresh,
                  ),
              },
              "minkowski": {
                  "verification": minkowski.verify_calculation_result(),
                  "differences": differences(
                      minkowski_recorded,
                      minkowski_fresh,
                  ),
              },
          }
          (root / "linux_scalar_reconstruction_diagnostics.json").write_text(
              json.dumps(diagnostics, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run focused non-Lean portability guards
        run: |
          python -m pytest -q \
            formal/python/tests/test_recovery_accepted_lineage_completeness.py \
            formal/python/tests/test_repository_hash_refresh_and_tracked_blob_identity_repair_result.py::test_v2_reconstructs_only_from_recorded_identity_domains \
            formal/python/tests/test_scalar_stress_energy_conformal_background_result_review.py \
            formal/python/tests/test_scalar_stress_energy_minkowski_result_review.py

      - name: Upload portability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-portability-diagnostics
          path: |
            formal/output/reports/linux_v2_reconstructed_packet.json
            formal/output/reports/linux_v2_reconstructed_manifest.json
            formal/output/reports/linux_v2_reconstructed_report.json
            formal/output/reports/linux_scalar_reconstruction_diagnostics.json
            formal/output/reports/linux_scalar_conformal_reconstructed_result.json
            formal/output/reports/linux_scalar_minkowski_reconstructed_result.json

  linux-current-control-and-lean:
    name: Linux Current Control + Complete Lean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frozen Python dependencies
        run: |
          python -m pip install --upgrade pip==26.0
          python -m pip install -r requirements.ci.lock

      - name: Build complete frozen Lean graph
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/toe_formal
          build: true
          build-args: "ToeFormal ToeFormalAll"
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Execute immutable current-control profile
        run: |
          python -m formal.python.tools.recovery_profile_runner \
            --profile current_control_plane \
            --collect-current-inventory \
            --junit formal/output/reports/current_control_plane_linux_v7.junit.xml \
            --basetemp "${RUNNER_TEMP}/toe-current-control-v7" \
            --report formal/output/reports/current_control_plane_linux_v7.json

      - name: Upload current-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-current-control-evidence
          path: |
            formal/output/reports/current_control_plane_linux_v7.junit.xml
            formal/output/reports/current_control_plane_linux_v7.json

  historical-debt-reporting:
    name: Historical Debt Complete Reporting
    runs-on: windows-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frozen Python dependencies
        run: |
          python -m pip install --upgrade pip==26.0
          python -m pip install -r requirements.ci.lock

      - name: Execute isolated historical profile with recorded-failure semantics
        shell: pwsh
        run: |
          python -m formal.python.tools.recovery_profile_runner `
            --profile historical_debt `
            --collect-current-inventory `
            --junit formal/output/reports/historical_debt_windows_v7.junit.xml `
            --basetemp "$env:RUNNER_TEMP/toe-historical-v7" `
            --allow-recorded-historical-failures `
            --report formal/output/reports/historical_debt_windows_v7.json

      - name: Upload visible historical-debt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-debt-evidence
          path: |
            formal/output/reports/historical_debt_windows_v7.junit.xml
            formal/output/reports/historical_debt_windows_v7.json
