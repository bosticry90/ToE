name = "toe_formal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ToeFormal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0-rc1"

[[lean_lib]]
name = "ToeFormal"

[[lean_exe]]
name = "vpc_certificate_checker"
root = "ToeFormal.VerifiedCalculator.RuntimeCertificateV1"

# Exhaustive validation root; intentionally nondefault so focused local builds
# retain their historical cost while CI can request every tracked module.
[[lean_lib]]
name = "ToeFormalAll"
